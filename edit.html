<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 정보 수정 - GameManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">GameManager</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">Add Game</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="mb-0">게임 정보 수정</h4>
                    </div>
                    <div class="card-body">
                        <!-- 기존 값을 미리 입력-->
                        <form id="editForm" onsubmit="return validateEditForm(event)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="gameTitle" class="form-label">게임명 (필수)</label>
                                    <input type="text" class="form-control" id="gameTitle" value="Elden Ring">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="gameGenre" class="form-label">장르 (필수)</label>
                                    <select class="form-select" id="gameGenre">
                                        <option value="">장르를 선택하세요</option>
                                        <option value="RPG">RPG</option>
                                        <option value="Action" selected>Action</option>
                                        <option value="FPS">FPS</option>
                                        <option value="Simulation">Simulation</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="releaseDate" class="form-label">출시일 (필수)</label>
                                    <input type="date" class="form-control" id="releaseDate" value="2022-02-25">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">가격 (₩, 필수)</label>
                                    <input type="number" class="form-control" id="price" value="64800">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="devEmail" class="form-label">개발사 이메일 (필수)</label>
                                <input type="email" class="form-control" id="devEmail" value="support@fromsoftware.jp">
                            </div>
                            <div class="mb-4">
                                <label for="description" class="form-label">상세 설명</label>
                                <textarea class="form-control" id="description" rows="4">틈새의 땅을 탐험하며 엘든 링의 파편을 찾아 엘데의 왕이 되기 위한 여정을 그리는 오픈 월드 액션 RPG 게임입니다.</textarea>
                            </div>
                            <div class="d-flex gap-2 justify-content-end">
                                <a href="view.html" class="btn btn-secondary">취소</a>
                                <button type="submit" class="btn btn-warning">수정 완료</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container"><p class="mb-0">&copy; 2026 Game Management System.</p></div>
    </footer>

    <script>
        function validateEditForm(event) {
            event.preventDefault(); 

            const title = document.getElementById('gameTitle').value;
            const genre = document.getElementById('gameGenre').value;
            const releaseDate = document.getElementById('releaseDate').value;
            const price = document.getElementById('price').value;
            const email = document.getElementById('devEmail').value;

            // 유효성 검증
            if (title.trim().length < 2) { alert("게임명은 최소 2자 이상 입력해야 합니다."); return false; }
            if (genre === "") { alert("장르를 선택해주세요."); return false; }
            if (releaseDate === "") { alert("출시일을 입력해주세요."); return false; }
            if (price === "" || price < 0) { alert("가격은 0원 이상의 숫자를 입력해야 합니다."); return false; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { alert("유효한 이메일 주소 형식이 아닙니다."); return false; }

            // 제출 Confirm
            if(confirm("게시물을 수정할까요?")) {
                alert("수정이 완료되었습니다.");
                window.location.href = "view.html";
            }
            return true;
        }
    </script>
</body>
</html>
