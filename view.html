<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Board - List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        h2 {
            margin: 0;
            color: #2c3e50;
        }
        .btn-add {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-add:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .title-cell {
            text-align: left;
        }
        .title-link {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
        }
        .title-link:hover {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h2>게시물 목록</h2>
        <!-- [Add] 버튼: add.html로 이동 -->
        <a href="add.html" class="btn-add">+ Add</a>
    </div>

    <table>
        <thead>
            <tr>
                <th width="10%">번호</th>
                <th width="45%">제목</th>
                <th width="15%">작성자</th>
                <th width="20%">생성일자</th>
                <th width="10%">조회수</th>
            </tr>
        </thead>
        <tbody>
            <!-- Sample Data 1 -->
            <tr>
                <td>3</td>
                <td class="title-cell">
                    <!-- 상세 보기 링크: view.html로 이동 -->
                    <a href="view.html" class="title-link">Vercel 배포 시 주의사항 안내</a>
                </td>
                <td>관리자</td>
                <td>2026-09-17</td>
                <td>128</td>
            </tr>
            <!-- Sample Data 2 -->
            <tr>
                <td>2</td>
                <td class="title-cell">
                    <a href="view.html" class="title-link">CRUD 메인 페이지 UI 디자인 시안</a>
                </td>
                <td>홍길동</td>
                <td>2026-09-16</td>
                <td>45</td>
            </tr>
            <!-- Sample Data 3 -->
            <tr>
                <td>1</td>
                <td class="title-cell">
                    <a href="view.html" class="title-link">첫 번째 테스트 게시글입니다.</a>
                </td>
                <td>김철수</td>
                <td>2026-09-15</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
